<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B263B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1B2A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096C7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00B4D8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Box - main body -->
  <g filter="url(#shadow)">
    <!-- Box bottom -->
    <rect x="120" y="220" width="272" height="160" rx="16" fill="url(#boxGradient)"/>
    <!-- Box top flap -->
    <path d="M120 220 L140 180 L372 180 L392 220 Z" fill="url(#boxGradient)"/>
    <!-- Box highlight -->
    <path d="M136 180 L356 180 L356 196 L136 196 Z" fill="#1E3A5F" opacity="0.3"/>
  </g>
  
  <!-- Location pin -->
  <g transform="translate(256, 140)">
    <!-- Pin circle -->
    <circle cx="0" cy="0" r="36" fill="url(#pinGradient)" filter="url(#shadow)"/>
    <!-- Pin hole -->
    <circle cx="0" cy="0" r="14" fill="url(#bgGradient)"/>
    <!-- Pin stem -->
    <path d="M0 36 L0 80" stroke="url(#pinGradient)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)"/>
    <!-- Pin tip -->
    <ellipse cx="0" cy="88" rx="12" ry="6" fill="url(#bgGradient)" filter="url(#shadow)"/>
  </g>
  
  <!-- Subtle tracking lines -->
  <g opacity="0.15" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 400 Q256 350 412 400"/>
    <path d="M120 420 Q256 380 392 420"/>
    <path d="M140 440 Q256 410 372 440"/>
  </g>
</svg>